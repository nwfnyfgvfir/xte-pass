name: Check upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  UPSTREAM_REPO: XTLS/Xray-core

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Compare latest upstream vs local releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          UP="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)"
          echo "Upstream latest: ${UP}"
          if gh release view "$UP" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Already released ${UP} — nothing to do"
            exit 0
          fi
          echo "Missing release for ${UP} — dispatching build"
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            -f version="$UP" \
            -f force=false
